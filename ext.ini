;═══════════════════════════════════════════════════════════════════════════
; AIYEMOT — main API extension configuration
;
; Where this goes: save as ext.ini inside the extension folder callers dial
; into (e.g. ivr2:/100/ext.ini). The two sub-folders /1 (record) and /2
; (play_and_return) must exist under it with their own ext.ini files.
;
; Flow this produces:
;   enter ext -> "מה שאלתך?" -> /1 record -> back up -> processing ->
;   /2 plays the answer (or "ברגע סבלנות") -> back up -> "מה שאלתך?" ...
;
; Say exactly "LOG OUT" / "LOGOUT" / "EXIT" (in English) as your question
; to reset the ChatGPT conversation without hanging up.
;═══════════════════════════════════════════════════════════════════════════

type=api
title=צאט קולי מבוסס AI

; ↓↓↓ REPLACE with your deployed Render URL once you have one (the value
; below is the expected production address of this project).
api_link=https://aiyemot.onrender.com/ivr

; --- Fixed extra parameters sent on every call to app.py -------------------
; (api_add_N's value is itself paramName=paramValue; YHM unpacks it into a
; real request parameter before calling the webhook.)
;
; Token per project decision: the real token is committed (same practice
; as the previous BOOKCHANGER repo). Rotate it if it ever leaks.
api_add_0=token=WU1BUElL.apik_HoloA3KHMTNh4eBKJ5V-mA.lHHr6CQBwLeX1MZKogt4g-kIHl__123U9syeugt6VRkadQ

; --- Standard call parameters app.py reads directly ------------------------
api_call_id_send=yes
api_phone_send=yes
