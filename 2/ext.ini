;═══════════════════════════════════════════════════════════════════════════
; AIYEMOT — answer playback sub-extension (folder "2" under the API ext)
;
; Where this goes: ivr2:/<API-EXT>/2/ext.ini
;
; type=play_and_return (YHM docs topic 1359): plays the .tts files that
; live in THIS folder — app.py writes the answer into 000.tts here — and
; when playback ends (or any key is pressed) automatically returns UP to
; the parent API extension, whose webhook then continues the loop with the
; "מה שאלתך?" greeting. This is the documented behavior requested for the
; answer step: play, then go back up, no extra keypress menus.
;
; play_and_return_play_all=yes: the answer cannot be skipped by accident
; mid-playback (every key would otherwise skip to the end).
;═══════════════════════════════════════════════════════════════════════════

type=play_and_return
play_and_return_play_all=yes
