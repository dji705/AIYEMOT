;═══════════════════════════════════════════════════════════════════════════
; AIYEMOT — recording sub-extension (folder "1" under the API extension)
;
; Where this goes: ivr2:/<API-EXT>/1/ext.ini
;
; The caller records their question here. When the recording ends, YHM
; sends them straight back up to the parent API extension (record_end_goto),
; which re-triggers app.py — exactly the proven bookchanger/main.py
; /{ext}/1 pattern.
;
; say_record_number=no / say_record_menu=no: suppress YHM's built-in
; "recording saved, press 1 to keep, 2 to redo" menu — the STT loop itself
; decides what happens next, so that menu would just add confusion.
;═══════════════════════════════════════════════════════════════════════════

type=record
say_record_number=no
say_record_menu=no
record_end_goto=/100
